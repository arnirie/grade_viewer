<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Midterm Grade Viewer</title>
  <meta name="description" content="Check your midterm grade, raw scores and computation by entering your moniker and student number.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <div class="warning" role="note">
      <strong>These grades are tentative.</strong>
      <span>They are not yet final and may change if we find an error in the encoding. Treat them as a reference for now, and tell me if something looks off.</span>
    </div>

    <section id="login-card" class="card">
      <h1>Midterm Grade Viewer</h1>
      <p class="sub">Type in the moniker and student number you registered with.</p>
      <form id="login-form" autocomplete="off">
        <label for="class">Class</label>
        <select id="class" name="class" required>
          <option value="" disabled selected>Choose your class</option>
          <option value="DW1">DW1</option>
          <option value="MAD1">MAD1</option>
          <option value="OOP-2A">OOP-2A</option>
          <option value="OOP-2B">OOP-2B</option>
          <option value="OOP-2C">OOP-2C</option>
        </select>
        <label for="moniker">Moniker</label>
        <input id="moniker" name="moniker" required placeholder="e.g. skywalker">
        <label for="student-id">Student number</label>
        <input id="student-id" name="id" required placeholder="26-UR-1234">
        <button id="submit-btn" type="submit">Show my grade</button>
        <p id="error" class="error" role="alert" hidden></p>
      </form>
    </section>

    <section id="result" hidden>
      <div class="card hero">
        <div>
          <p class="eyebrow" id="r-section"></p>
          <h2 id="r-name"></h2>
          <p class="sub" id="r-meta"></p>
        </div>
        <div class="mg">
          <span>Midterm grade</span><strong id="r-mg"></strong>
          <button id="logout-btn" class="logout" type="button">Log out</button>
        </div>
      </div>
      <div class="split">
        <div class="card" id="written"></div>
        <div class="card" id="lab"></div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
